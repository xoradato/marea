# Light for the day, dark for checking tomorrow's plan at night. Viewers switch in the app menu
# (top right) > Settings, or follow their device. Every text pair was checked for WCAG AA.
[theme]
baseRadius = "medium"
metricValueFontSize = "1.4rem"
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
headingFont = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap"
chartCategoricalColors = ["#0C6E7A", "#3D5A80", "#98C1D9", "#E0A458", "#C2412B"]

[theme.light]
primaryColor = "#0C6E7A"
backgroundColor = "#F4F7F6"
secondaryBackgroundColor = "#E4ECEA"
textColor = "#10262F"
borderColor = "#D3DEDB"
linkColor = "#0C6E7A"
dataframeHeaderBackgroundColor = "#E4ECEA"

[theme.light.sidebar]
backgroundColor = "#E8EFED"
secondaryBackgroundColor = "#F4F7F6"
textColor = "#10262F"
borderColor = "#D3DEDB"

[theme.dark]
primaryColor = "#237E8A"
backgroundColor = "#0B1A24"
secondaryBackgroundColor = "#132A38"
textColor = "#E3EEF0"
borderColor = "#27445A"
linkColor = "#6FC9D2"
dataframeHeaderBackgroundColor = "#132A38"

[theme.dark.sidebar]
backgroundColor = "#0E2230"
secondaryBackgroundColor = "#16323F"
textColor = "#E3EEF0"
borderColor = "#27445A"
